trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  displayName: Use Node.js 20
  inputs:
    versionSpec: 20.x

- script: npm ci
  displayName: Install dependencies

- script: npm run lint
  displayName: Type-check extension

- script: npm run compile
  displayName: Build extension

- task: AzureCLI@2
  displayName: Publish GraphForge to Marketplace
  inputs:
    azureSubscription: graphforge-marketplace-publishing
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      npx --no-install vsce publish --azure-credential