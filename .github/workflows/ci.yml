name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, compile, unit test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Compile
        run: npm run compile

      - name: Verify VSIX contents
        run: npm run verify:package

      - name: Unit tests
        run: npm run test:unit

  vscode-test:
    name: Extension Development Host tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: build
    # Downloads a real VS Code build and launches it headlessly under Xvfb.
    # Blocking (issue #24 host-switch gate): this is the only automated detector
    # for the builds-green-but-fails-to-activate failure class.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run vscode-test (Extension Development Host)
        run: xvfb-run -a npm test

  package:
    name: vsce package (dry run)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package extension (no publish)
        run: npx vsce package --no-dependencies -o graphforge-ci.vsix

      - name: Upload .vsix artifact
        # Best-effort: the packaging step above is the actual gate. Don't fail the
        # required job over org-level artifact storage/quota issues.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: graphforge-vsix
          path: graphforge-ci.vsix
          retention-days: 7
