name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      qualify_hub_clone:
        description: "Qualify the packaged VSIX with the public Core candidate on Linux, macOS, and Windows"
        type: boolean
        default: false
      probe_core_arm64:
        description: "Reproduce the published Core Hub clone on real Linux arm64 (#104)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-arm64-probe:
    name: Native Linux arm64 Core Hub clone
    if: github.event_name == 'workflow_dispatch' && inputs.probe_core_arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install the exact published Core addon
        run: npm install --prefix "$RUNNER_TEMP/core-probe" --no-package-lock --no-save --no-audit --no-fund @curatelabs/graphforge@0.6.0-rc.5
      - name: Clone through Core directly on arm64
        run: node scripts/probe-core-hub-clone.cjs "$RUNNER_TEMP/core-probe/node_modules/@curatelabs/graphforge" openalex/openalex "$RUNNER_TEMP/core-probe" "$RUNNER_TEMP/core-probe/report.json"
      - name: Preserve native reproduction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-arm64-probe
          path: ${{ runner.temp }}/core-probe/report.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: Check, compile, unit test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Qualification runner regression tests
        run: node --test scripts/qualify-hub-clone.test.cjs

      - name: Compile
        run: npm run compile

      - name: Verify VSIX contents
        run: npm run verify:package

      - name: Unit tests
        run: npm run test:unit

  vscode-test:
    name: Extension Development Host tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: build
    # Downloads a real VS Code build and launches it headlessly under Xvfb.
    # Blocking (issue #24 host-switch gate): this is the only automated detector
    # for the builds-green-but-fails-to-activate failure class.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run vscode-test (Extension Development Host)
        run: xvfb-run -a npm test

  package:
    name: vsce package (dry run)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package extension (no publish)
        run: npx vsce package --no-dependencies -o graphforge-ci.vsix

      - name: Upload .vsix artifact
        # Best-effort: the packaging step above is the actual gate. Don't fail the
        # required job over org-level artifact storage/quota issues.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: graphforge-vsix
          path: graphforge-ci.vsix
          retention-days: 7

  hub-clone-qualification:
    name: Hub clone qualification (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_hub_clone
    needs: package
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install test runner dependencies
        run: npm ci

      - name: Download the packaged extension from this commit
        uses: actions/download-artifact@v8
        with:
          name: graphforge-vsix

      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Qualify Linux storage and durable reopen
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run qualify:hub-clone -- graphforge-ci.vsix "${{ runner.temp }}/hub-clone-evidence"

      - name: Qualify desktop storage and durable reopen
        if: runner.os != 'Linux'
        run: npm run qualify:hub-clone -- graphforge-ci.vsix "${{ runner.temp }}/hub-clone-evidence"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hub-clone-${{ matrix.os }}
          path: ${{ runner.temp }}/hub-clone-evidence/report.json
          if-no-files-found: warn
          retention-days: 30
